# 正式GPU验证与最终测试；不是训练超参数。
# 启用：python scripts/train.py --validation reach_validation
# 验证用于选权重，最终测试结果不参与重新选择。
episodes = 100 # 每个权重评估的回合数。
steps = 250 # 每回合控制步数；当前0.02秒/步，共5秒，目标固定。
seed = 30000 # 验证目标种子，不是训练种子。
hold_steps = 25 # 连续成功采样点数；端点跨度(25-1)×0.02=0.48秒。
target_min_radius = 0.02 # 初始TCP附近采样半径下限，单位米；排除初始已成功目标。
target_max_radius = 0.06 # 采样半径上限，单位米；径向均匀采样，非体积均匀。
interval = 100 # 按原生checkpoint编号验证，跳过0；须为save-interval的整数倍。
test_seed = 100000 # 最终测试目标种子，必须不同于seed；该种子已有历史测试记录。
# 反复调参后应选择尚未用于决策的测试种子，不能把重复使用的测试集当成全新测试集。
