[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebotarm-rl"
version = "0.1.0"
description = "reBotArm mjlab tasks, training configuration and policy evaluation"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/huangbinai/rebotarm_rl"
Issues = "https://github.com/huangbinai/rebotarm_rl/issues"

[project.entry-points."mjlab.tasks"]
rebotarm_reach = "rebotarm_rl.backends.mjlab.registration"

[project.scripts]
rebotarm-rl-fetch-model = "rebotarm_rl.assets.resources:main"
rebotarm-rl-paired-eval = "rebotarm_rl.backends.mjlab.evaluation.paired_eval:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rebotarm_rl*"]

[tool.setuptools.package-data]
"rebotarm_rl.assets" = ["model_manifest.json", "rebotarm/*.xml", "rebotarm/assets/*.STL", "rebotarm/assets/*.stl", "rebotarm/assets/gemini2/*.STL", "rebotarm/assets/gemini2/*.stl"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]
mjlab = ["mjlab==1.6.0", "numpy>=1.26", "torch>=2.7", "tensordict"]
