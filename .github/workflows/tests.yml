name: contracts
on: [push, pull_request]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools pytest
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -I -m pytest tests -q
      - run: python -m compileall src/rebotarm_rl -q
